<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Stage Editor</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="editor-app">
    <!-- ツールバー -->
    <header id="toolbar">
      <div class="toolbar-group">
        <span class="toolbar-title">2D STAGE EDITOR</span>
        <div class="dimension-input">
          <label for="input-width">幅(W):</label>
          <input type="number" id="input-width" min="10" max="250" value="60">
        </div>
        <div class="dimension-input">
          <label for="input-height">高(H):</label>
          <input type="number" id="input-height" min="10" max="60" value="18">
        </div>
        <button id="btn-resize">サイズ変更</button>
      </div>

      <div class="toolbar-group">
        <button id="btn-export-textures" title="assets/textures/ に配置する初期PNG画像をダウンロードします">テクスチャ画像DL</button>
        <button id="btn-clear" class="danger">全消去</button>
        <button id="btn-io">JSON 入出力</button>
        <button id="btn-testplay" class="primary">▶ テストプレイ</button>
      </div>
    </header>

    <!-- メイン領域 -->
    <div id="workspace">
      <!-- タイルパレット -->
      <aside id="palette-sidebar">
        <div class="sidebar-title">タイルパレット</div>
        <div id="tile-palette-grid"></div>
      </aside>

      <!-- キャンバス配置エリア -->
      <main id="canvas-viewport">
        <canvas id="editor-canvas"></canvas>
      </main>
    </div>

    <!-- ステータスバー -->
    <footer id="statusbar">
      <div id="status-coords">座標: (X: 0, Y: 0)</div>
      <div id="status-selection">選択タイル: [1] 地面ブロック</div>
      <div id="status-grid-toggle">左クリック: 描画 / 右クリック: 消しゴム</div>
    </footer>
  </div>

  <!-- JSON入出力モーダル -->
  <div id="modal-io" class="modal-overlay">
    <div class="modal-window">
      <div class="modal-header">
        <span>ステージデータ JSON</span>
        <button id="btn-modal-close">×</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 12px; color: var(--text-muted);">
          作成したデータをコピーして保存するか、既存のJSONを貼り付けてインポートしてください。
        </p>
        <textarea id="io-textarea" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <button id="btn-copy-json">クリップボードにコピー</button>
        <button id="btn-download-json">ファイル保存 (.json)</button>
        <button id="btn-import-json" class="primary">ステージに反映</button>
      </div>
    </div>
  </div>

  <!-- スクリプト順次読み込み -->
  <script src="js/common/constants.js"></script>
  <script src="js/common/sprites.js"></script>
  <script src="js/common/tilemap.js"></script>
  <script src="js/editor/editor-canvas.js"></script>
  <script src="js/editor/editor-ui.js"></script>
  <script src="js/editor/editor-main.js"></script>
</body>
</html>
